<nav class="reset-steps" aria-label="Pasos de recuperación">
  <ol>
    <li class="{% if current_step >= 1 %}completed{% endif %}{% if current_step == 1 %} current{% endif %}"{% if current_step == 1 %} aria-current="step"{% endif %}><span>1</span>Correo</li>
    <li class="{% if current_step >= 2 %}completed{% endif %}{% if current_step == 2 %} current{% endif %}"{% if current_step == 2 %} aria-current="step"{% endif %}><span>2</span>{% if recovery_method == 'link' %}Enlace{% else %}Código{% endif %}</li>
    <li class="{% if current_step >= 3 %}completed{% endif %}{% if current_step == 3 %} current{% endif %}"{% if current_step == 3 %} aria-current="step"{% endif %}><span>3</span>Nueva contraseña</li>
  </ol>
</nav>

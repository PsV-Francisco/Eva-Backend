<aside class="role-sidebar" aria-label="Módulos del cargo">
  <p class="eyebrow">MÓDULOS</p>
  <nav>
    {% for module in sidebar_modules %}
      {% if module.url_name %}<a class="sidebar-link{% if request.resolver_match.view_name == module.url_name %} active{% endif %}" href="{% url module.url_name %}">
        <span class="sidebar-index">{{ forloop.counter|stringformat:'02d' }}</span>
        {{ module.label }}
      </a>{% else %}<span class="sidebar-link{% if forloop.first %} active{% endif %}">
        <span class="sidebar-index">{{ forloop.counter|stringformat:'02d' }}</span>
        {{ module }}
      </span>{% endif %}
    {% endfor %}
  </nav>
</aside>
